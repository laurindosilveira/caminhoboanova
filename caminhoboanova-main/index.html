    <!-- Splash screen styles (inline for instant render) -->
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, hsl(226, 62%, 22%) 0%, hsl(250, 55%, 35%) 100%);
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }
      #splash-logo {
        width: 80px;
        height: 80px;
        border-radius: 24px;
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        animation: splash-pulse 1.5s ease-in-out infinite;
      }
      #splash-logo img {
        width: 48px;
        height: 48px;
        border-radius: 12px;
      }
      #splash-title {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 28px;
        color: #fff;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
      }
      #splash-subtitle {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        color: rgba(255,255,255,0.5);
        margin-bottom: 32px;
      }
      #splash-loader {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: rgba(255,255,255,0.8);
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      #splash-offline {
        position: absolute;
        bottom: 48px;
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        color: rgba(255,255,255,0.4);
        display: none;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.85; }
      }
    </style>
  </head>

  <body>
    <!-- Splash Screen (shown before React mounts) -->
    <div id="splash-screen">
      <div id="splash-logo">
        <img src="/pwa-192x192.png" alt="Caminho" />
      </div>
      <div id="splash-title">Caminho</div>
      <div id="splash-subtitle">Crescendo na fé, juntos ✝️</div>
      <div id="splash-loader"></div>
      <div id="splash-offline">Modo offline — usando dados salvos</div>
    </div>

    <div id="root"></div>
    <script>
      // Show offline indicator on splash if no connection
      if (!navigator.onLine) {
        var offlineEl = document.getElementById('splash-offline');
        if (offlineEl) offlineEl.style.display = 'block';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
